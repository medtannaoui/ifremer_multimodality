# =============================================================================
# CONFIGURATION - Entraînement modèle IR -> SAR (Flow Matching)
# =============================================================================

# -----------------------------------------------------------------------------
irar: True                  # Mode "image-to-image autoregressif" (désactivé)

use_flow_matching: False      # Utiliser le Flow Matching comme méthode générative
use_residu: True             # Apprentissage du résidu (par rapport au modèle de régression)
best_regression_model_pt: "/scale/user/mtannaou/alternance/src/IR_to_SAR/ML_IR_SAR/training_results/IRAR_regression/train_ir_sar_1/best_regression_model.pt"
fm_num_inference_steps: 50   # Nombre de pas d'inférence pour le Flow Matching
fm_lr: 0.00008                # Learning rate spécifique au Flow Matching

conditional_model: False      # Conditionner le modèle sur des features environnementales (shear, etc.)


# -----------------------------------------------------------------------------
img_size: 256
in_channels: 11
out_channels: 1


block_out_channels: [16, 16, 32, 64]
down_block_types: ["DownBlock2D", "DownBlock2D", "AttnDownBlock2D", "DownBlock2D"]
up_block_types:   ["UpBlock2D",   "UpBlock2D",   "AttnUpBlock2D",   "UpBlock2D"]


# -----------------------------------------------------------------------------
irwin_channels: 11             # Nombre de canaux temporels IRWIN utilisés
add_era5: False               # Ajouter les données ERA5 colocalisées en entrée


# -----------------------------------------------------------------------------
output_data: "sar"            # Options : aam | sar
norm: "annular"                # Normalisation de la sortie : annular | z_score


# -----------------------------------------------------------------------------
augmentation: True

# -----------------------------------------------------------------------------
w_pix: 1.0                    # Poids du terme pixel-wise
w_grad: 0.0                   # Poids du terme de gradient
w_radial: 2.0                 # Poids du terme radial
combined_loss: True           # Combiner les différents termes de perte


# -----------------------------------------------------------------------------
channel_dropout: False        # Active le dropout sur les canaux d'entrée
channel_drop_prob: 0.2        # Probabilité de drop par canal
min_keep_channels: 5          # Nombre minimum de canaux conservés
protect_channels: []          # Canaux jamais droppés


# -----------------------------------------------------------------------------
batch_size: 32
learning_rate: 0.00008
num_epochs: 200
dropout: 0.05

early_stop_patience: 60
early_stop_delta: 0.0000001

scheduler: "cosin"             # Options : cosin | expo | reduceplateau | onecycle
scheduler_every_n_epochs: 10


# -----------------------------------------------------------------------------
anggrek_test: True


# -----------------------------------------------------------------------------
cond_dim: 16                   # shear_magnitude: 8, shear_direction: 8, thermal_wind: 2
cross_attention_dim: 64


# -----------------------------------------------------------------------------
accelerator: "gpu"
devices: [4, 5, 6, 7]                   


# -----------------------------------------------------------------------------
save_dir: "/scale/user/mtannaou/alternance/src/IR_to_SAR/ML_IR_SAR/training_results/IRAR_flow_matching/"   


# -----------------------------------------------------------------------------
start_epoch: 0
plot_interval: 20
num_val_exemples: 10

code_test: False                # Mode test rapide (réduit la taille du dataset)



# -----------------------------------------------------------------------------
data_path: "/scale/user/mtannaou/alternance/src/IR_to_SAR/data_sar_ir_pkl/data_cleaned.pkl"